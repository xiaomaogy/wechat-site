    <h1 class="post-title">最富酋长国里最土豪的清真寺</h1>
    <p class="post-meta">高小猫 · 2025年1月2日</p>
    <div class="post-body">
<p>在阿拉伯联合酋长国里，传说石油最多的是迪拜旁边的阿布扎比。</p><p><br/></p><p>这是网上的资料：</p><p><br/></p><p><span style='caret-color: rgb(232, 232, 232);color: rgb(232, 232, 232);font-family: "Google Sans", "Helvetica Neue", sans-serif;font-size: 20px;font-style: normal;font-variant-caps: normal;font-weight: 400;letter-spacing: normal;orphans: auto;text-align: start;text-indent: 0px;text-transform: none;white-space: normal;widows: auto;word-spacing: 0px;-webkit-tap-highlight-color: rgba(255, 255, 255, 0);-webkit-text-size-adjust: none;-webkit-text-stroke-width: 0px;background-color: rgb(31, 31, 31);text-decoration: none;display: inline !important;float: none;'>据估算，迪拜的石油大概是40亿桶。 按照现在的油价，再刨去一些开采成本，大概值2000亿美元。 这肯定是一大笔财富，但绝对谈不上让迪拜一百年衣食无忧的地步。 而边上的阿布扎比，</span><b style='color: rgb(255, 255, 255);font-style: normal;font-weight: 500;background: linear-gradient(90deg, rgb(52, 69, 127) 50%, rgba(0, 0, 0, 0) 50%) 0% 0px / 200% 100% no-repeat;animation: 0.75s cubic-bezier(0.05, 0.7, 0.1, 1) 0.25s forwards highlight;font-family: "Google Sans", "Helvetica Neue", sans-serif;font-size: 20px;font-variant-caps: normal;letter-spacing: normal;orphans: auto;text-align: start;text-indent: 0px;text-transform: none;white-space: normal;widows: auto;word-spacing: 0px;-webkit-tap-highlight-color: rgba(255, 255, 255, 0);-webkit-text-size-adjust: none;-webkit-text-stroke-width: 0px;text-decoration: none;'>石油储量有920亿桶，是迪拜的23倍，相当于全球超过5％的石油储量</b><span style='caret-color: rgb(232, 232, 232);color: rgb(232, 232, 232);font-family: "Google Sans", "Helvetica Neue", sans-serif;font-size: 20px;font-style: normal;font-variant-caps: normal;font-weight: 400;letter-spacing: normal;orphans: auto;text-align: start;text-indent: 0px;text-transform: none;white-space: normal;widows: auto;word-spacing: 0px;-webkit-tap-highlight-color: rgba(255, 255, 255, 0);-webkit-text-size-adjust: none;-webkit-text-stroke-width: 0px;background-color: rgb(31, 31, 31);text-decoration: none;display: inline !important;float: none;'>。</span></p><p><span style='caret-color: rgb(232, 232, 232);color: rgb(232, 232, 232);font-family: "Google Sans", "Helvetica Neue", sans-serif;font-size: 20px;font-style: normal;font-variant-caps: normal;font-weight: 400;letter-spacing: normal;orphans: auto;text-align: start;text-indent: 0px;text-transform: none;white-space: normal;widows: auto;word-spacing: 0px;-webkit-tap-highlight-color: rgba(255, 255, 255, 0);-webkit-text-size-adjust: none;-webkit-text-stroke-width: 0px;background-color: rgb(31, 31, 31);text-decoration: none;display: inline !important;float: none;'><br/></span></p><p><span style="caret-color: rgb(0, 0, 0);font-family: -webkit-standard;font-size: medium;font-style: normal;font-variant-caps: normal;font-weight: 400;letter-spacing: normal;orphans: auto;text-align: start;text-indent: 0px;text-transform: none;white-space: normal;widows: auto;word-spacing: 0px;-webkit-tap-highlight-color: rgba(26, 26, 26, 0.3);-webkit-text-size-adjust: auto;-webkit-text-stroke-width: 0px;text-decoration: none;display: inline !important;float: none">那这么土豪的地方，造的清真寺，显然也非常土豪。</span></p><p><span style="caret-color: rgb(0, 0, 0);font-family: -webkit-standard;font-size: medium;font-style: normal;font-variant-caps: normal;font-weight: 400;letter-spacing: normal;orphans: auto;text-align: start;text-indent: 0px;text-transform: none;white-space: normal;widows: auto;word-spacing: 0px;-webkit-tap-highlight-color: rgba(26, 26, 26, 0.3);-webkit-text-size-adjust: auto;-webkit-text-stroke-width: 0px;text-decoration: none;display: inline !important;float: none"><br/></span></p><p style="text-align: start;"><span style="caret-color: rgb(0, 0, 0);font-family: -webkit-standard;font-size: medium;letter-spacing: normal;-webkit-text-size-adjust: auto">以下是图片</span></p><p style="text-align: start;"><span style="caret-color: rgb(0, 0, 0);font-family: -webkit-standard;font-size: medium;letter-spacing: normal;-webkit-text-size-adjust: auto"><br/></span></p><p style="text-align: start;"><span style="caret-color: rgb(0, 0, 0);font
